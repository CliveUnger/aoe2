[project]
name = "aoe2-analysis"
version = "1.0.0"
description = "AoE2:DE replay analysis and coaching-report toolkit"
requires-python = ">=3.12"
dependencies = [
    "mgz",
]

[project.scripts]
aoe2 = "cli:main"

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# E402: several tools set logging/sys.path state before importing mgz — intentional.
ignore = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["analyze", "audit", "cli", "debrief", "extract_full", "parse",
              "replaylib", "vill_ledger"]

# mgz is our hard fork, editable-cloned at ./aoc-mgz (see README Setup).
[tool.uv.sources]
mgz = { path = "aoc-mgz", editable = true }
